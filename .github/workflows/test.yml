name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Backend and frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.1
        uses: actions/setup-node@v5
        with:
          # Pin Node to the project's .nvmrc
          node-version-file: '.nvmrc'
          node-version: '22.23.1'
          # Explicitly set cache-dependency-path so setup-node can find lockfiles in agroshop/
          cache: 'npm'
          cache-dependency-path: |
            agroshop/backend/package-lock.json
            agroshop/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: agroshop/backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: agroshop/frontend
        run: npm install

      - name: Run backend tests
        working-directory: agroshop/backend
        run: npm test

      - name: Build frontend
        working-directory: agroshop
        run: npm --prefix frontend run build
